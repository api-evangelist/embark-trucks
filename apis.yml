name: Embark Trucks
description: >-
  Embark Trucks was an autonomous-trucking company founded in 2016 and backed by
  Y Combinator, building a self-driving software stack (the Embark Driver) for
  Class 8 semi-trucks operating on interstate highway freight lanes. The company
  went public via a SPAC merger with Northern Star Investment Corp II in late
  2021, but wound down operations in November 2023 after failing to secure
  additional funding; its autonomous-driving technology and engineering assets
  were subsequently acquired by Applied Intuition. Embark never operated a public
  developer platform, REST API, or developer portal, so this API Evangelist
  profile is an identity record rather than a live API. Its only surviving public
  technical surface is the embarktrucks GitHub organization, which hosts
  open-source robotics and autonomous-vehicle tooling (ROS drivers, LIDAR/camera
  integrations, and the webviz visualization libraries) rather than first-party
  API client SDKs.
